<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <pattern id="grid-lang" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23262f" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="titleGrad-lang" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#14161e"/>
  <rect width="900" height="520" fill="url(#grid-lang)"/>
  <rect x="0" y="0" width="900" height="3" fill="url(#titleGrad-lang)" opacity="0.7"/>
  <rect x="0" y="517" width="900" height="3" fill="url(#titleGrad-lang)" opacity="0.35"/>

  <!-- Title -->
