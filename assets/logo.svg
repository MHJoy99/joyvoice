<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="micGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Subtle accent line at top -->
  <rect x="0" y="0" width="720" height="3" fill="url(#textGrad)" opacity="0.6"/>

  <!-- Microphone icon -->
  <g transform="translate(80, 55)" filter="url(#glow)">
    <!-- Mic body -->
    <rect x="28" y="10" width="32" height="48" rx="16" fill="none" stroke="url(#micGrad)" stroke-width="2.5"/>
    <!-- Mic grille lines -->
    <line x1="34" y1="22" x2="34" y2="30" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
    <line x1="40" y1="22" x2="40" y2="30" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
    <line x1="46" y1="22" x2="46" y2="30" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
    <line x1="52" y1="22" x2="52" y2="30" stroke="#22d3ee" stroke-width="1.2" opacity="0.7"/>
    <!-- Mic base/curve -->
    <path d="M 44 58 Q 44 74 44 74 L 44 82" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Mic stand -->
    <path d="M 34 82 Q 44 92 54 82" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="88" x2="44" y2="96" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
    <line x1="30" y1="96" x2="58" y2="96" stroke="#22d3ee" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- JoyVoice title -->
  <text x="170" y="68" fill="url(#textGrad)" font-size="38" font-weight="700" letter-spacing="-0.5">JoyVoice</text>

  <!-- Divider line -->
  <line x1="170" y1="82" x2="470" y2="82" stroke="#334155" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="170" y="108" fill="#94a3b8" font-size="12" font-weight="500">
    Floating Mic Dictation
  </text>
  <text x="170" y="128" fill="#64748b" font-size="11" font-weight="400">
    Bengali → English Translation • ~3.3s • No GPU
  </text>

  <!-- F8 hotkey badge -->
  <rect x="170" y="142" width="54" height="20" rx="4" fill="rgba(34, 211, 238, 0.1)" stroke="#0891b2" stroke-width="0.8"/>
  <text x="197" y="155" fill="#22d3ee" font-size="10" font-weight="600" text-anchor="middle">F8</text>

  <!-- Subtle bottom line -->
  <rect x="0" y="197" width="720" height="3" fill="url(#textGrad)" opacity="0.4"/>
</svg>
